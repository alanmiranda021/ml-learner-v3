<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AutoML Acadêmico — Regressão e Classificação</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.css" />
    <style>
      :root{--bg:#f6f5ff;--ink:#1b1f3b;--a:#6c5ce7;--b:#00b8a9;--c:#fd79a8}
      @media (prefers-color-scheme:dark){:root{--bg:#12132a;--ink:#ecebff}}
      body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
      #boot{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4rem;
        background:radial-gradient(circle at 20% 20%,rgba(108,92,231,.35),transparent 45%),radial-gradient(circle at 80% 80%,rgba(0,184,169,.35),transparent 45%),var(--bg);
        transition:opacity .7s;padding:env(safe-area-inset-top) 1rem env(safe-area-inset-bottom)}
      #boot a,#boot button{color:var(--ink);padding:.6rem 1rem;border:1px solid currentColor;border-radius:8px;background:transparent;cursor:pointer}
      #boot.done{opacity:0;pointer-events:none}
      .orbit{position:relative;width:120px;height:120px}
      .orbit i{position:absolute;inset:0;border-radius:50%;border:3px solid transparent;border-top-color:var(--a);animation:spin 1.6s linear infinite}
      .orbit i:nth-child(2){inset:14px;border-top-color:var(--b);animation-duration:1.1s;animation-direction:reverse}
      .orbit i:nth-child(3){inset:28px;border-top-color:var(--c);animation-duration:.8s}
      .orbit b{position:absolute;inset:0;display:grid;place-items:center;font-size:2.2rem}
      @keyframes spin{to{transform:rotate(360deg)}}
      h1{margin:0;font-size:1.7rem;text-align:center;background:linear-gradient(120deg,var(--a),var(--b),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent}
      #tip{min-height:1.4em;opacity:.8;text-align:center;max-width:32ch;transition:opacity .4s}
      .bar{width:min(280px,70vw);height:6px;border-radius:9px;background:rgba(128,128,160,.25);overflow:hidden}
      .bar span{display:block;height:100%;width:40%;border-radius:9px;background:linear-gradient(90deg,var(--a),var(--b));animation:slide 1.4s ease-in-out infinite}
      @keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}
      @media (prefers-reduced-motion:reduce){.orbit i,.bar span{animation:none}}
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="orbit"><i></i><i></i><i></i><b>🧠</b></div>
      <h1>AutoML Acadêmico</h1>
      <div class="bar"><span></span></div>
      <div id="tip" role="status" aria-live="polite">Acordando o Python no seu navegador…</div>
    </div>
    <div id="root"></div>
    <noscript>Ative o JavaScript para executar o ML Learner.</noscript>
    <script type="module" src="boot.js"></script>
  </body>
</html>
